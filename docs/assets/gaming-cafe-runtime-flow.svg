<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Gaming Cafe runtime flow</title>
  <desc id="desc">An animated pulse travels from the Windows launcher through the browser interface and Spring Boot API into the SQLite database.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .detail { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .caption { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #67e8f9; letter-spacing: 1px; }
      .box { fill: #182642; stroke: #334a78; stroke-width: 2; }
      .line { fill: none; stroke: #41628f; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <text x="50" y="44" class="caption">LOCAL-FIRST RUNTIME • ONE ORIGIN • NO CLOUD DEPENDENCY</text>

  <path id="flow-a" class="line" d="M260 132 C300 132 310 132 350 132"/>
  <path id="flow-b" class="line" d="M550 132 C590 132 600 132 640 132"/>
  <path id="flow-c" class="line" d="M840 132 C880 132 890 132 930 132"/>

  <g>
    <rect class="box" x="50" y="82" width="210" height="100" rx="18"/>
    <text x="155" y="119" text-anchor="middle" class="label">🪟 Windows launcher</text>
    <text x="155" y="145" text-anchor="middle" class="detail">single instance + readiness</text>
    <text x="155" y="165" text-anchor="middle" class="detail">bundled Java runtime</text>
  </g>
  <g>
    <rect class="box" x="350" y="82" width="200" height="100" rx="18"/>
    <text x="450" y="119" text-anchor="middle" class="label">🌐 React UI</text>
    <text x="450" y="145" text-anchor="middle" class="detail">browser on :8080</text>
    <text x="450" y="165" text-anchor="middle" class="detail">relative /api calls</text>
  </g>
  <g>
    <rect class="box" x="640" y="82" width="200" height="100" rx="18"/>
    <text x="740" y="119" text-anchor="middle" class="label">⚙️ Spring Boot</text>
    <text x="740" y="145" text-anchor="middle" class="detail">security + business rules</text>
    <text x="740" y="165" text-anchor="middle" class="detail">REST + scheduled jobs</text>
  </g>
  <g>
    <rect class="box" x="930" y="82" width="210" height="100" rx="18"/>
    <text x="1035" y="119" text-anchor="middle" class="label">🗃️ SQLite</text>
    <text x="1035" y="145" text-anchor="middle" class="detail">persistent local data</text>
    <text x="1035" y="165" text-anchor="middle" class="detail">safe online backups</text>
  </g>

  <circle r="7" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#flow-a"/></animateMotion>
  </circle>
  <circle r="7" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="3.8s" begin="1.25s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#flow-b"/></animateMotion>
  </circle>
  <circle r="7" fill="#f0abfc" filter="url(#glow)">
    <animateMotion dur="3.8s" begin="2.5s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#flow-c"/></animateMotion>
  </circle>

  <text x="600" y="230" text-anchor="middle" class="detail">Development: Vite :5173 ── proxy ──▶ Spring Boot :8080  |  Production: Spring Boot serves the bundled UI</text>
</svg>
