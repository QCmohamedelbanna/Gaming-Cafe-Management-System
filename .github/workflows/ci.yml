name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prepare dedicated MySQL test database
        shell: bash
        run: |
          sudo systemctl start mysql
          test_db_password="$(openssl rand -hex 32)"
          sudo mysql --protocol=socket --user=root <<SQL
          CREATE DATABASE IF NOT EXISTS ps_cafe_test;
          CREATE USER IF NOT EXISTS 'ps_cafe_ci'@'127.0.0.1' IDENTIFIED BY '${test_db_password}';
          ALTER USER 'ps_cafe_ci'@'127.0.0.1' IDENTIFIED BY '${test_db_password}';
          GRANT ALL PRIVILEGES ON ps_cafe_test.* TO 'ps_cafe_ci'@'127.0.0.1';
          FLUSH PRIVILEGES;
          SQL
          {
            echo "TEST_DB_URL=jdbc:mysql://127.0.0.1:3306/ps_cafe_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            echo "TEST_DB_USER=ps_cafe_ci"
            echo "TEST_DB_PASSWORD=$test_db_password"
          } >> "$GITHUB_ENV"

      - name: Run backend tests
        working-directory: backend
        run: mvn -B -Pmysql-integration test

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
