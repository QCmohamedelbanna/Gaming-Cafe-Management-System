name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
      TZ: Africa/Cairo
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ps_cafe_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Cairo
      TEST_DB_USER: ps_cafe_ci
      TEST_DB_PASSWORD: ps_cafe_test_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ps_cafe_test
          MYSQL_USER: ps_cafe_ci
          MYSQL_PASSWORD: ps_cafe_test_password
          MYSQL_ROOT_PASSWORD: ps_cafe_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=ps_cafe_ci --password=ps_cafe_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify dedicated MySQL test database
        shell: bash
        run: |
          mysql_container_id="${{ job.services.mysql.id }}"
          docker exec -e MYSQL_PWD="$TEST_DB_PASSWORD" "$mysql_container_id" \
            mysqladmin ping --protocol=tcp --host=127.0.0.1 --port=3306 \
            --user="$TEST_DB_USER" --silent
          docker exec -e MYSQL_PWD="$TEST_DB_PASSWORD" "$mysql_container_id" \
            mysql --protocol=tcp --host=127.0.0.1 --port=3306 \
            --user="$TEST_DB_USER" --database=ps_cafe_test \
            --batch --skip-column-names --execute='SELECT 1;'

      - name: Run backend tests
        working-directory: backend
        run: mvn -B -Pmysql-integration -Duser.timezone=Africa/Cairo clean verify

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22.22.2
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
