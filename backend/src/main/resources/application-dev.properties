# Local development profile. Run from backend/ to keep using the existing
# backend/ps_cafe.db file, or override GAMING_CAFE_DEV_DB_PATH.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

app.data-dir=.
app.database-path=${GAMING_CAFE_DEV_DB_PATH:ps_cafe.db}
app.log-dir=logs
app.backup-dir=backup

server.address=127.0.0.1
spring.datasource.url=jdbc:sqlite:${app.database-path}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.task.scheduling.enabled=true
logging.level.com.cafe.ps=DEBUG

# Bootstrap credentials must be supplied through the untracked root .env file
# or the process environment when creating a fresh development database. An
# existing database with users does not need these properties.
app.default-admin-username=${ADMIN_USERNAME:}
app.default-admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
