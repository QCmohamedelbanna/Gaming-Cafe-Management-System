# Local development profile. Matches the credentials provisioned by the
# root docker-compose.yml `mysql` service — run `docker compose up mysql`
# before starting the backend.
spring.datasource.url=jdbc:mysql://localhost:3306/ps_cafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ps_user
spring.datasource.password=ps_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.task.scheduling.enabled=true

logging.level.com.cafe.ps=DEBUG

# Dev-only defaults. Never used when the prod profile is active, which
# requires ADMIN_USERNAME/ADMIN_PASSWORD to be set explicitly.
app.default-admin-username=admin
app.default-admin-password=admin123
