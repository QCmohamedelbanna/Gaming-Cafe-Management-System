spring.profiles.active=dev

server.port=8080
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# inventory.prevent-negative, pos.discount.allowed-roles,
# dashboard.ending-soon-minutes, and reservations.no-show-grace-minutes
# used to live here as static config; they are now admin-editable at
# runtime via the Settings page / AppSettings (see SettingsService).

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Only health/info are ever served; health probes are what container
# orchestrators (Docker, k8s) poll, so they stay public while every other
# actuator endpoint stays out of the exposure list entirely.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
