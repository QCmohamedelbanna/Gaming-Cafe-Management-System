spring.profiles.active=dev

server.port=8080
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

inventory.prevent-negative=true
pos.discount.allowed-roles=ADMIN,MANAGER
dashboard.ending-soon-minutes=30
reservations.no-show-grace-minutes=20

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Only health/info are ever served; health probes are what container
# orchestrators (Docker, k8s) poll, so they stay public while every other
# actuator endpoint stays out of the exposure list entirely.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
