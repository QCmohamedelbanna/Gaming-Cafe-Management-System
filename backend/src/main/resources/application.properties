spring.application.name=gaming-cafe
spring.profiles.default=prod

server.port=${SERVER_PORT:${GAMING_CAFE_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# SQLite serializes writes. The default single connection keeps the local
# application deterministic; an administrator can raise DB_POOL_SIZE only
# after validating the workload and SQLite locking behavior.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:1}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.connection-test-query=SELECT 1

# Flyway is restricted to the SQLite migration location. The baseline is
# non-destructive and allows the legacy SQLite file to acquire migration
# metadata while keeping every existing row.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.version=@project.version@
app.launcher-managed=${GAMING_CAFE_LAUNCHER_MANAGED:false}
app.cors.allowed-origins=

# Only health/info are exposed. Health stays public so the launcher and local
# service checks can distinguish a healthy Gaming Cafe process.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=Gaming Cafe
info.app.version=@project.version@
