# Installed/runtime profile. Paths are resolved centrally by the application
# from GAMING_CAFE_* overrides or Windows %ProgramData%.
app.data-dir=${GAMING_CAFE_DATA_DIR:}
app.database-path=${GAMING_CAFE_DB_PATH:}
app.log-dir=${GAMING_CAFE_LOG_DIR:}
app.backup-dir=${GAMING_CAFE_BACKUP_DIR:}

spring.datasource.url=jdbc:sqlite:${app.database-path}
spring.datasource.driver-class-name=org.sqlite.JDBC
# Flyway owns production schema changes. SQLite reports INTEGER primary keys
# for Java Long identifiers, which is not compatible with Hibernate's strict
# validate mode; do not let Hibernate mutate or reject the migrated schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.task.scheduling.enabled=true

# Same-origin production has no Vite origin and therefore needs no CORS
# allowance. Set CORS_ALLOWED_ORIGINS only for an explicitly separate trusted
# administrative frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# The launcher supplies a generated one-time bootstrap password on a new
# installation when ADMIN_* are not provided. Existing databases do not need
# these values because SeedData only creates an administrator when no users
# exist.
app.default-admin-username=${ADMIN_USERNAME:}
app.default-admin-password=${ADMIN_PASSWORD:}

logging.level.root=INFO
logging.level.com.cafe.ps=INFO
