# Production profile. Every value below is required to be supplied via
# environment variable; the app fails fast at startup if any are missing
# rather than silently falling back to a dev-only default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false

spring.task.scheduling.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.default-admin-username=${ADMIN_USERNAME}
app.default-admin-password=${ADMIN_PASSWORD}

logging.level.root=INFO
logging.level.com.cafe.ps=INFO
