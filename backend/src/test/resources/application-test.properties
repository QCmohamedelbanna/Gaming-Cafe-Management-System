# Integration tests use a disposable MySQL database supplied by the test
# environment. Keep all runtime filesystem paths inside the Maven workspace;
# the datasource itself is supplied by AbstractMySQLIntegrationTest.
app.data-dir=target/test-runtime
app.database-path=${app.data-dir}/test.db
app.log-dir=${app.data-dir}/logs
app.backup-dir=${app.data-dir}/backup
# The production single-instance guard is intentionally disabled for tests;
# multiple Spring contexts share the disposable test database in one suite.
app.launcher-managed=true

server.address=127.0.0.1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# MySQL integration tests need more than the single SQLite connection used by
# the local application, especially for the concurrent checkout test. Replace
# the SQLite PRAGMA init statement inherited from application.properties with a
# harmless MySQL statement.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.connection-test-query=SELECT 1

# Always apply the production MySQL migrations to a clean test database.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Scheduled maintenance is invoked directly by the relevant tests; it must
# not race those tests in the background.
spring.task.scheduling.enabled=false

# Disposable fallback values for any test context that does not override the
# credentials dynamically. They are never used by production profiles.
app.default-admin-username=integration-admin
app.default-admin-password=test-only-admin-password
device-control.mode=mock
tuya.enabled=false
